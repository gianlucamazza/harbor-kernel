[package]
name = "kernel-core"
version = "0.1.0"
edition = "2024"
description = "Pure, host-testable logic shared by the kernel: register encodings and allocator math"
license = "MIT OR Apache-2.0"
publish = false

# No dependencies and no MMIO: everything here is a total function over
# integers, unit-tested on the host.
[dependencies]

[lints.rust]
# `deny`, not `forbid`: the SPSC ring and the wake queue need an `UnsafeCell`
# buffer and a `Sync` assertion to offer a `&self` API, which is what keeps the
# IRQ producer and the main-loop consumer from ever holding aliasing `&mut`.
# Those two modules carry a module-scoped `#[allow]` each, and both are covered
# by single-threaded and two-thread host tests under Miri.
unsafe_code = "deny"

[lints.clippy]
# The kernel crate denies this workspace-wide; the allow-carrying modules here
# must meet the same bar — an `unsafe` block without a SAFETY comment is a
# build error, not a review note.
undocumented_unsafe_blocks = "deny"
