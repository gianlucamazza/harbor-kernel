[package]
name = "kernel-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Pure, host-testable logic shared by the kernel: register encodings and allocator math"
license = "MIT OR Apache-2.0"
publish = false

# No dependencies and no MMIO: everything here is a total function over
# integers, unit-tested on the host.
[dependencies]

[lints.rust]
# `deny`, not `forbid`: the SPSC ring needs an `UnsafeCell` buffer and a `Sync`
# assertion to offer a `&self` API, which is what keeps the IRQ producer and
# the main-loop consumer from ever holding aliasing `&mut`. It is the only
# `unsafe` in the crate, it carries a scoped `#[allow]`, and it is covered by
# both single-threaded and two-thread host tests.
unsafe_code = "deny"
