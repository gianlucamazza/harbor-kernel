[workspace]
members = ["crates/kernel-core"]

[package]
name = "harbor-kernel"
version = "0.1.0"
edition = "2024"
description = "Agent-based microkernel for Raspberry Pi 4 Model B"
license = "MIT OR Apache-2.0"
publish = false
readme = "README.md"
categories = ["embedded", "no-std", "os"]
keywords = ["raspberry-pi", "aarch64", "kernel", "bare-metal"]

[features]
default = ["board-rpi4", "oracle"]
# Active board package (exactly one board-* for a product image).
# Selection is compile-time; see docs/porting.md and ADR-0015.
board-rpi4 = []
# The boot oracle: the demo tasks and agents whose console lines every gate in
# `qemu-boot-check.sh` asserts on. Rule 9 of `docs/architecture.md` puts
# diagnostic scaffolding behind a feature rather than in the production surface,
# and 544 lines of demo agents were sitting in every image — the same shape as
# the rule-7 exception ADR-0019 closed, unnoticed because no gate looked at what
# lands in the image.
#
# **On by default**, unlike `bringup` and `debug-display`. `make boot-check` *is*
# the oracle: a default that turns it off makes the project's central gate need a
# flag, and a gate that needs a flag is a gate someone forgets. What changes is
# not the default — it is that an image without it exists, is compiled, and is
# checked by `make product-builds`.
oracle = []

# Bring-up scaffolding: the masked CNTP/HPPIR/IAR gates used to debug the M1
# GIC path, and the raw GIC register accessors they need. Off by default so
# none of it is compiled into a production image — and so the diagnostic
# accessors cannot leak into the stable driver API by accident.
bringup = []
# Optional SPI TFT status surface (ADR-0009). Pulls in SpiBus/SpiDevice, the
# BCM2711 SPI0 controller, and the BSP pinmux/bind for a Waveshare-class HAT.
# Default images stay headless; enable explicitly for lab glass.
debug-display = []

[dependencies]
# Pure register/allocator arithmetic, unit-tested on the host.
kernel-core = { path = "crates/kernel-core" }

[lints.clippy]
# `kernel-core` can deny `unsafe_code` outright; this crate cannot — it is the
# half that touches MMIO, system registers and assembly. What it can require is
# that every one of those blocks says what makes it sound.
#
# Turned on with 64 of 179 blocks still undocumented, so the modules holding
# them carried a file-level `#[allow]` with a count — writing 64 SAFETY comments
# in one pass, without re-deriving each invariant, produces decoration that
# reads like verification. Each came off when the audit reached that module.
#
# **The list is empty as of 2026-08-06**: no `#[allow(…undocumented_unsafe_blocks)]`
# remains, and the tree carries 181 SAFETY comments over 174 `unsafe` blocks.
# The debt is paid, and saying so here is not bookkeeping — this comment
# described an outstanding balance for a week after it was settled, which is
# the same shape as every other fact this project keeps in two places.
undocumented_unsafe_blocks = "deny"

# `panic = "abort"` in both profiles is not a size preference: there is no
# unwinder in a `no_std` kernel, and `panic = "unwind"` asks for a personality
# routine and `.eh_frame` that nothing here can service. The panic handler in
# `src/panic.rs` masks IRQs, steals the console and parks — it never returns,
# so unwinding has nothing to unwind to.
[profile.dev]
opt-level = 1
panic = "abort"
lto = false
# Not `opt-level = 0`: at zero the image roughly triples and every MMIO helper
# becomes a real call, which changes the timing of the bring-up paths enough to
# be a different kernel from the one that gets flashed. One is the lowest level
# that still inlines the accessors. Reached with `make debug`, and built by
# `make check` so it cannot rot between the two times a year someone needs gdb.
debug = true

[profile.release]
panic = "abort"
# Size over speed: the image is copied to an SD card and the whole kernel is
# cold on every boot, so `-O3`-style expansion costs more in i-cache and load
# time than it returns.
opt-level = "s"
lto = true
codegen-units = 1
# Debug info and symbols are kept deliberately. `llvm-objcopy -O binary` drops
# every non-alloc section, so `kernel8.img` is unaffected — but `make no-simd`
# and `scripts/check-pre-mmu-path.sh` disassemble the *ELF*, and both need
# symbol names to say which function they are complaining about. Stripping here
# would leave those gates reporting hex addresses.
debug = true
strip = false
