[workspace]
members = ["crates/kernel-core"]

[package]
name = "harbor-kernel"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Agent-based microkernel for Raspberry Pi 4 Model B"
license = "MIT OR Apache-2.0"
publish = false
readme = "README.md"
categories = ["embedded", "no-std", "os"]
keywords = ["raspberry-pi", "aarch64", "kernel", "bare-metal"]

[features]
default = []
# Bring-up scaffolding: the masked CNTP/HPPIR/IAR gates used to debug the M1
# GIC path, and the raw GIC register accessors they need. Off by default so
# none of it is compiled into a production image — and so the diagnostic
# accessors cannot leak into the stable driver API by accident.
bringup = []

[dependencies]
# Pure register/allocator arithmetic, unit-tested on the host.
kernel-core = { path = "crates/kernel-core" }

[profile.dev]
panic = "abort"
opt-level = 1
lto = false
debug = true

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
debug = true
strip = false
