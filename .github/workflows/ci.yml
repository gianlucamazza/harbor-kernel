name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the channel, components, and softfloat target.
      - name: Show toolchain
        run: rustc -vV && cargo -V

      # Ubuntu's qemu-system-arm (even 8.2 on 24.04) does **not** ship the
      # `raspi4b` machine Harbor boots under. Local Arch/QEMU ≥9 does. CI
      # therefore builds a thin Arch image once and wraps qemu-system-aarch64 so
      # `make boot-check` / `make check` keep a single path.
      - name: Install llvm
        run: sudo apt-get update && sudo apt-get install -y llvm

      - name: QEMU with raspi4b (Arch container wrapper)
        run: |
          set -euo pipefail
          docker build -t harbor-qemu-raspi4b - <<'Dockerfile'
          FROM archlinux:latest
          RUN pacman -Syu --noconfirm qemu-system-aarch64
          ENTRYPOINT ["qemu-system-aarch64"]
          Dockerfile
          sudo tee /usr/local/bin/qemu-system-aarch64 >/dev/null <<'WRAP'
          #!/usr/bin/env bash
          # Forward host paths into the container (kernel image, cwd).
          set -euo pipefail
          exec docker run --rm -i \
            -v /home/runner:/home/runner \
            -v /tmp:/tmp \
            -w "${PWD}" \
            harbor-qemu-raspi4b \
            "$@"
          WRAP
          sudo chmod +x /usr/local/bin/qemu-system-aarch64
          qemu-system-aarch64 -version
          qemu-system-aarch64 -machine help | grep -E '^raspi4b\b'

      - name: Install nightly with Miri
        run: |
          rustup toolchain install nightly --component miri
          cargo +nightly miri setup

      - name: make check
        run: make check

      - name: Build kernel image
        run: make img

      - uses: actions/upload-artifact@v4
        with:
          name: kernel8.img
          path: target/aarch64-unknown-none-softfloat/release/kernel8.img

  qemu-boot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install llvm
        run: sudo apt-get update && sudo apt-get install -y llvm

      - name: QEMU with raspi4b (Arch container wrapper)
        run: |
          set -euo pipefail
          docker build -t harbor-qemu-raspi4b - <<'Dockerfile'
          FROM archlinux:latest
          RUN pacman -Syu --noconfirm qemu-system-aarch64
          ENTRYPOINT ["qemu-system-aarch64"]
          Dockerfile
          sudo tee /usr/local/bin/qemu-system-aarch64 >/dev/null <<'WRAP'
          #!/usr/bin/env bash
          set -euo pipefail
          exec docker run --rm -i \
            -v /home/runner:/home/runner \
            -v /tmp:/tmp \
            -w "${PWD}" \
            harbor-qemu-raspi4b \
            "$@"
          WRAP
          sudo chmod +x /usr/local/bin/qemu-system-aarch64

      - name: Build kernel image
        run: make img

      - name: Boot under QEMU and assert a healthy run
        run: make boot-check
