name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the channel, the components and the
      # `-softfloat` target, so there is nothing to configure here.
      - name: Show toolchain
        run: rustc -vV && cargo -V

      # `make check` includes the QEMU boot and Miri. Installing both here is
      # what makes the "local check is a superset of CI" claim in
      # docs/verification.md true rather than aspirational: without QEMU the
      # boot check would refuse to run, and the job would fail — which is the
      # intended behaviour, not a nuisance.
      - name: Install llvm and QEMU
        run: sudo apt-get update && sudo apt-get install -y llvm qemu-system-arm

      - name: Install nightly with Miri
        run: |
          rustup toolchain install nightly --component miri
          cargo +nightly miri setup

      # fmt --check, host tests, the no-SIMD guard on the linked image, and
      # clippy for both targets. The no-SIMD step is the one that matters most:
      # a silent switch back to a NEON-enabled target would otherwise surface
      # only as a synchronous exception on the board.
      - name: make check
        run: make check

      - name: Build kernel image
        run: make img

      - uses: actions/upload-artifact@v4
        with:
          name: kernel8.img
          path: target/aarch64-unknown-none-softfloat/release/kernel8.img

  qemu-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU and llvm
        run: sudo apt-get update && sudo apt-get install -y qemu-system-arm llvm

      - name: Build kernel image
        run: make img

      # Same script `make check` runs, so the two cannot drift. Kept as its own
      # job so a boot regression is legible at a glance instead of buried in
      # the middle of a longer gate.
      - name: Boot under QEMU and assert a healthy run
        run: make boot-check
