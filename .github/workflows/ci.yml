name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the channel, the components and the
      # `-softfloat` target, so there is nothing to configure here.
      - name: Show toolchain
        run: rustc -vV && cargo -V

      - name: Install llvm-objcopy / llvm-objdump
        run: sudo apt-get update && sudo apt-get install -y llvm

      # fmt --check, host tests, the no-SIMD guard on the linked image, and
      # clippy for both targets. The no-SIMD step is the one that matters most:
      # a silent switch back to a NEON-enabled target would otherwise surface
      # only as a synchronous exception on the board.
      - name: make check
        run: make check

      - name: Build kernel image
        run: make img

      - uses: actions/upload-artifact@v4
        with:
          name: kernel8.img
          path: target/aarch64-unknown-none-softfloat/release/kernel8.img

  qemu-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU and llvm
        run: sudo apt-get update && sudo apt-get install -y qemu-system-arm llvm

      - name: Build kernel image
        run: make img

      # Same script `make check` runs locally, so the two gates cannot drift.
      # It fails loudly if QEMU cannot provide the machine, rather than passing
      # with no coverage.
      - name: Boot under QEMU and assert a healthy run
        run: make boot-check

      # The script skips when QEMU is missing, which is right for a developer
      # machine and wrong here: CI installs it, so a skip means the install
      # broke and the job would otherwise report coverage it does not have.
      - name: Fail if the boot check was skipped
        run: |
          command -v qemu-system-aarch64 >/dev/null \
            || { echo "::error::qemu-system-aarch64 missing — boot check did not run"; exit 1; }
