name: CI

on:
  push:
  pull_request:

# `on: push` and `on: pull_request` both fire for a branch in this repo, so
# every same-repo PR runs the whole pipeline twice. Superseded runs are
# cancelled instead of racing each other for a runner.
#
# The key must name the *branch*, not the ref: a push carries
# `refs/heads/<branch>` and a pull_request carries `refs/pull/N/merge`, so
# grouping on `github.ref` puts the two runs in different groups and cancels
# neither. That is what happened on the first run of this workflow — two jobs
# for one branch, which is the thing the block exists to prevent.
#
# A cancelled run is reported by `gh run list` with `conclusion: failure`, not
# `cancelled`, when the cancellation lands mid-step — the *job* says `cancelled`
# and no step failed. That looks exactly like a real red on a PR, and cost a
# diagnostic detour once. Check the job before believing the run:
#   gh run view <id> --json jobs --jq '.jobs[] | "\(.name): \(.conclusion)"'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

# The workflow reads the repository and uploads an artifact. It has no reason to
# write anything, and it builds a Dockerfile whose content a fork's PR can
# influence.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Read-only runner telemetry explains QEMU starvation without weakening the
  # boot oracle. It intentionally records no environment variables or secrets.
  HARBOR_CI_DIAGNOSTICS: "1"
  # Pinned by digest, not by tag. `rust-toolchain.toml` argues at length that a
  # green from yesterday says nothing about today, and then the richest gate in
  # this project — the QEMU boot oracle, over a hundred assertions — used to run
  # on `archlinux:latest` behind a rolling `pacman -Syu`. A QEMU release that
  # changes the `raspi4b` model could turn CI red, or green, with nothing in the
  # repository having changed.
  #
  # Updating is a deliberate commit, exactly like the toolchain bump: change the
  # digest, watch the run, and the boot oracle validates the new emulator before
  # it reaches anyone else.
  ARCH_IMAGE: archlinux@sha256:345a872f6c95e082d4b8c050af637eebb57402c6e2177b411c3acf7df84eb33b
  # `raspi4b` first appears in QEMU 9. Asserting the floor means a container
  # that somehow resolves to an older build fails loudly here rather than in the
  # middle of a boot check.
  QEMU_MIN_MAJOR: "9"

jobs:
  # One job. There used to be two, and the second rebuilt the image and re-ran
  # `boot-check` — which `make check` had already run in the first. That is the
  # most expensive step in the pipeline, paid twice, plus a duplicated
  # twenty-five-line container setup that could drift between copies.
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the channel, components, and softfloat target.
      - name: Show toolchain
        run: rustc -vV && cargo -V

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install llvm
        run: sudo apt-get update && sudo apt-get install -y llvm

      # Ubuntu's qemu-system-arm (even 8.2 on 24.04) does **not** ship the
      # `raspi4b` machine Harbor boots under. CI therefore wraps an
      # Arch-packaged qemu-system-aarch64 so `make boot-check` / `make check`
      # keep a single path — the assertions live in the script, never here.
      - name: QEMU with raspi4b (pinned Arch container)
        run: |
          set -euo pipefail
          docker build -t harbor-qemu-raspi4b - <<Dockerfile
          FROM ${ARCH_IMAGE}
          RUN pacman -Sy --noconfirm qemu-system-aarch64
          ENTRYPOINT ["qemu-system-aarch64"]
          Dockerfile
          sudo tee /usr/local/bin/qemu-system-aarch64 >/dev/null <<'WRAP'
          #!/usr/bin/env bash
          # Forward host paths into the container (kernel image, cwd).
          set -euo pipefail
          if [[ "${HARBOR_CI_DIAGNOSTICS:-0}" == "1" && -x scripts/check/ci-runner-diagnostics.sh ]]; then
            scripts/check/ci-runner-diagnostics.sh --phase qemu-wrapper
          fi
          if [[ "${HARBOR_CI_DIAGNOSTICS:-0}" != "1" ]]; then
            exec docker run --rm -i \
              -v /home/runner:/home/runner \
              -v /tmp:/tmp \
              -w "${PWD}" \
              harbor-qemu-raspi4b \
              "$@"
          fi
          container_name="harbor-qemu-${BASHPID}"
          docker run --rm --name "${container_name}" -i \
            -v /home/runner:/home/runner \
            -v /tmp:/tmp \
            -w "${PWD}" \
            harbor-qemu-raspi4b \
            "$@" &
          container_pid=$!
          (
            while :; do
              if ! docker inspect "${container_name}" \
                --format 'qemu-container host_config cpus={{.HostConfig.NanoCpus}} quota={{.HostConfig.CpuQuota}} period={{.HostConfig.CpuPeriod}} cpuset={{.HostConfig.CpusetCpus}} shares={{.HostConfig.CpuShares}}' \
                2>/dev/null; then
                break
              fi
              docker stats --no-stream \
                --format 'qemu-container stats name={{.Name}} cpus={{.CPUPerc}} mem={{.MemUsage}}' \
                "${container_name}" 2>&1 || true
              sleep 1
            done
          ) >&2 &
          stats_pid=$!
          set +e
          wait "${container_pid}"
          rc=$?
          kill "${stats_pid}" 2>/dev/null || true
          wait "${stats_pid}" 2>/dev/null || true
          set -e
          exit "${rc}"
          WRAP
          sudo chmod +x /usr/local/bin/qemu-system-aarch64
          qemu-system-aarch64 -version
          major="$(qemu-system-aarch64 -version | sed -n 's/^QEMU emulator version \([0-9]\+\).*/\1/p')"
          if [[ -z "${major}" || "${major}" -lt "${QEMU_MIN_MAJOR}" ]]; then
            echo "error: need QEMU >= ${QEMU_MIN_MAJOR} for the raspi4b machine, got '${major}'" >&2
            exit 1
          fi
          qemu-system-aarch64 -machine help | grep -E '^raspi4b\b'

      - name: Install nightly with Miri
        run: |
          rustup toolchain install nightly --component miri
          cargo +nightly miri setup

      # shellcheck is relied on by `make check`; installing it explicitly means
      # the gate lints something even if the runner image drops it. Without
      # this, both the prerequisite and the step below would go green having
      # linted nothing — the failure `no-simd` was fixed for.
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      # `make mutation-freshness` (ADR-0096) asks cargo-mutants how much
      # mutable surface the scope has today and compares it with the stamp the
      # last run wrote. It is the same question here as on a workstation, so it
      # is the same tool: a gate that answered differently depending on where
      # it ran would be two gates, and the one that ran in CI would be the one
      # nobody could reproduce. `--locked` so the Cargo.lock in this repo does
      # not decide the version of a host tool; the cargo cache above keeps the
      # build out of most runs.
      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked

      - name: Capture runner capacity (before check)
        run: |
          mkdir -p target/ci-diagnostics
          scripts/check/ci-runner-diagnostics.sh --phase before-check \
            | tee target/ci-diagnostics/before-check.txt

      # Every gate, including the boot oracle. `make check` is deliberately a
      # superset of this job's gates — the sole exception is the firmware blob
      # fetch below, a network step kept out of the offline target on purpose.
      - name: make check
        run: make check

      - name: Capture runner capacity (after check)
        if: always()
        continue-on-error: true
        run: |
          mkdir -p target/ci-diagnostics
          scripts/check/ci-runner-diagnostics.sh --phase after-check \
            | tee target/ci-diagnostics/after-check.txt

      - name: Shell scripts
        run: make shellcheck

      # The blob hashes are checked at fetch time and again when writing to an
      # SD card — on a developer's machine, with a card inserted. A corrupted
      # `EXPECTED.sha256` or a dead upstream tag was discoverable nowhere else.
      - name: Platform firmware blobs
        run: make blobs

      - name: Build kernel image
        run: make img

      - name: Record what produced this image
        run: |
          set -euo pipefail
          sha256sum target/aarch64-unknown-none-softfloat/release/kernel8.img \
            | tee target/aarch64-unknown-none-softfloat/release/kernel8.img.sha256
          rustc -vV | sed -n 's/^release: /rustc /p' >> \
            target/aarch64-unknown-none-softfloat/release/kernel8.img.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: kernel8.img
          path: |
            target/aarch64-unknown-none-softfloat/release/kernel8.img
            target/aarch64-unknown-none-softfloat/release/kernel8.img.sha256
          retention-days: 30

      - name: Upload runner diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-runner-diagnostics
          path: target/ci-diagnostics/*.txt
          if-no-files-found: ignore
          retention-days: 30
